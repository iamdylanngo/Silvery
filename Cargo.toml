[package]
name = "silvery"
version = "0.1.7"
edition = "2021"
build = "build.rs"

[[bin]]
name = "silvery"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "x11", "wayland"] }
egui = "0.37"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.18"
# Speech to text runs on the processor everywhere. On Macs it also uses the graphics chip (Metal).
# On Windows/Linux you can build with `--features cuda` (Nvidia) or `--features vulkan` for a graphics card.
whisper-rs = "0.16"

[build-dependencies]
winresource = "0.1"

[features]
default = []
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
block2 = "0.6"
