# Checks on every push that Silvery builds on real macOS, Linux and Windows machines, and keeps each program
# as a download under the run's "Artifacts".
# Published downloads for people are made by release.yml when a version tag is pushed.
name: Build Silvery

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: silvery-macos
            file: target/release/silvery
          - os: ubuntu-22.04
            name: silvery-linux-x86_64
            file: target/release/silvery
          - os: ubuntu-22.04-arm
            name: silvery-linux-arm64
            file: target/release/silvery
          - os: windows-latest
            name: silvery-windows-x64
            file: target/release/silvery.exe
    runs-on: ${{ matrix.os }}
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build tools (sound, window and speech engine)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libasound2-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.file }}
