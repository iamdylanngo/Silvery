# Publishes a Silvery release. Push a version tag (for example v0.2.0) and GitHub builds Silvery on its
# own Mac, Linux and Windows machines with the scripts in release/, then attaches the six downloads to a
# new release on the Releases page.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Or: Actions › Release › Run workflow, and enter the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.2.0). It's created if it doesn't exist."
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-latest
            script: ./release/macos-intel.sh
          - name: macOS Apple Silicon
            runner: macos-latest
            script: ./release/macos-apple-silicon.sh
          # Ubuntu 22.04 machines: the Linux programs also run on Ubuntu 22.04+, Debian 12+ and similar.
          - name: Linux x86_64
            runner: ubuntu-22.04
            script: ./release/linux-x86_64.sh
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            script: ./release/linux-arm64.sh
          - name: Windows x64
            runner: windows-latest
            script: ./release/windows-x64.ps1
          - name: Windows arm64
            runner: windows-11-arm
            script: ./release/windows-arm64.ps1
            # New: if this one fails, the release still goes out with the other five.
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      # Optional Mac signing + notarization (removes the "Apple could not verify" warning).
      # Add these repository secrets to switch it on; see docs/releasing.md. Without them the Mac
      # apps are signed ad-hoc and people use "Open Anyway" the first time.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      SILVERY_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      SILVERY_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
      SILVERY_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SILVERY_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the release tag as Silvery's version (v1.2.3 → 1.2.3)
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$v\"/m" Cargo.toml
          else
            echo "Tag '$TAG' isn't a version like v1.2.3; keeping the version from Cargo.toml."
          fi
          grep -m1 '^version' Cargo.toml

      - name: Developer ID certificate (only if the secrets are set)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$RUNNER_TEMP/build.keychain"
          security find-identity -v -p codesigning
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build tools (sound, window and speech engine)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libasound2-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: LLVM for Windows on ARM (speech engine)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          # The build tools here run as ARM64 programs, so they need the ARM64 build of LLVM
          # (an x64 libclang.dll can't be loaded by them). Install it if what's there isn't ARM64.
          function Get-PeMachine($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            return [BitConverter]::ToUInt16($b, $pe + 4)   # 0xAA64 = ARM64, 0x8664 = x64
          }
          $llvm = "C:\Program Files\LLVM\bin"
          $isArm = (Test-Path "$llvm\libclang.dll") -and ((Get-PeMachine "$llvm\libclang.dll") -eq 0xAA64)
          if (-not $isArm) {
            $v = "19.1.7"
            $llvm = "C:\LLVM-arm64\bin"
            Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-woa64.exe" -OutFile llvm.exe
            Start-Process .\llvm.exe -ArgumentList "/S", "/D=C:\LLVM-arm64" -Wait
          }
          "LLVM (ARM64): $llvm"
          & "$llvm\clang-cl.exe" --version
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: ${{ matrix.script }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    # Publish whatever was built, even if the experimental Windows ARM build failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Checksums
        run: |
          cd downloads
          ls -la
          test -n "$(ls)" || { echo "Nothing was built."; exit 1; }
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Remove old files from this release (for example from an earlier run of the same tag)
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r name; do
                if [ ! -f "downloads/$name" ]; then
                  echo "Removing old file: $name"
                  gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" -y
                fi
              done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Silvery ${{ env.TAG }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## ⬇️ Download Silvery

            | Your computer | Download |
            |---|---|
            | 🍎 Mac with an Apple chip (M1, M2, M3, M4…) | **[Silvery for Mac (Apple chip)](${{ env.BASE }}/Silvery-macOS-AppleSilicon.zip)** |
            | 🍎 Mac with an Intel chip | **[Silvery for Mac (Intel)](${{ env.BASE }}/Silvery-macOS-Intel.zip)** |
            | 🪟 Windows 10/11 PC | **[Silvery for Windows](${{ env.BASE }}/Silvery-Windows-x64.zip)** |
            | 🪟 Windows 11 on ARM (Snapdragon laptops) | [Silvery for Windows on ARM](${{ env.BASE }}/Silvery-Windows-arm64.zip) |
            | 🐧 Linux PC (Intel/AMD) | **[Silvery for Linux](${{ env.BASE }}/Silvery-Linux-x86_64.tar.gz)** |
            | 🐧 Linux on ARM (Ubuntu on Apple-chip Macs, Raspberry Pi 4/5) | [Silvery for Linux on ARM](${{ env.BASE }}/Silvery-Linux-arm64.tar.gz) |

            **Which one?** Mac: Apple menu › *About This Mac*: "Chip: Apple M…" means Apple chip.
            Windows: Settings › System › About › *System type*. Linux: `uname -m` (`aarch64` means ARM).

            You also need [Ollama](https://ollama.com) with a model, for example `ollama pull qwen3:8b`.
            Step-by-step install: [user guide](https://github.com/${{ github.repository }}/blob/main/docs/user-guide.md#installing-silvery).

            <details>
            <summary><b>First time opening</b> (macOS says "Apple could not verify…", Windows says "Windows protected your PC")</summary>

            **Mac:** press **Done**, then open **System Settings › Privacy & Security**, scroll down to
            *"Silvery.app" was blocked…* and press **Open Anyway** (then **Open Anyway** again and your password).
            Silvery isn't signed with an Apple developer certificate yet, so macOS asks once.

            **Windows:** choose **More info › Run anyway**.
            </details>

            ---
          files: downloads/*
