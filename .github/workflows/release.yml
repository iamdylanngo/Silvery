# Publishes a Silvery release: push a version tag (for example v0.1.0) and GitHub builds
# Silvery for macOS and Linux, then attaches the downloads to a new release on the Releases page.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Windows is paused for now and isn't part of releases yet.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.1.0). It's created if it doesn't exist."
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: "macOS (universal, Apple chip + Intel)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build Silvery.app
        run: ./build-macos.sh universal
      - name: Name the download
        run: mv dist/Silvery-macos-universal.zip dist/Silvery-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Silvery-macOS.zip

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 runners: the result also runs on Ubuntu 22.04+, Debian 12+ and similar (glibc 2.35+)
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build tools (sound, window and speech engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libasound2-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --release
      - name: Package (program + icon + menu entry)
        run: |
          d=silvery-linux-${{ matrix.arch }}
          mkdir -p "$d"
          cp target/release/silvery "$d/silvery"
          cp assets/logo-256.png "$d/silvery.png"
          cp LICENSE "$d/"
          cat > "$d/silvery.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Silvery
          Comment=Private meeting notes with a local AI
          Exec=silvery
          Icon=silvery
          Categories=Office;AudioVideo;
          Terminal=false
          EOF
          cat > "$d/install.sh" <<'EOF'
          #!/bin/sh
          # Installs Silvery for this user: program in ~/.local/bin, menu entry and icon.
          set -e
          cd "$(dirname "$0")"
          mkdir -p ~/.local/bin ~/.local/share/applications ~/.local/share/icons/hicolor/256x256/apps
          install -m 755 silvery ~/.local/bin/silvery
          install -m 644 silvery.png ~/.local/share/icons/hicolor/256x256/apps/silvery.png
          sed "s|^Exec=.*|Exec=$HOME/.local/bin/silvery|" silvery.desktop > ~/.local/share/applications/silvery.desktop
          echo "Silvery is installed. Find it in your applications menu, or run: ~/.local/bin/silvery"
          EOF
          chmod +x "$d/install.sh"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: silvery-linux-${{ matrix.arch }}.tar.gz

  publish:
    name: Publish the release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Checksums
        run: cd downloads && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Silvery ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | Mac (Apple chip or Intel, macOS 11+) | **Silvery-macOS.zip** |
            | Linux PC (Intel/AMD) | **silvery-linux-x86_64.tar.gz** |
            | Linux on ARM (Ubuntu on Apple-chip Macs, Raspberry Pi 4/5) | **silvery-linux-arm64.tar.gz** |

            You also need [Ollama](https://ollama.com) with a model, for example `ollama pull qwen3:8b`.
            Install steps are in the [user guide](https://github.com/${{ github.repository }}/blob/main/docs/user-guide.md#installing-silvery).
          files: downloads/*
