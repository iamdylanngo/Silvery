<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Silvery logo: a silver speech bubble with sound-wave bars on an indigo tile ("voices into notes") -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E78F4"/>
      <stop offset="1" stop-color="#3B44C4"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF0F5"/>
      <stop offset="1" stop-color="#C7CCD8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E2380" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile (macOS icon grid: 824 px square with ~100 px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- speech bubble -->
  <g filter="url(#shadow)">
    <path fill="url(#silver)" d="
      M 330 262 H 694 A 120 120 0 0 1 814 382 V 584 A 120 120 0 0 1 694 704
      H 452 L 318 806 L 338 704 H 330 A 120 120 0 0 1 210 584 V 382 A 120 120 0 0 1 330 262 Z"/>
  </g>

  <!-- sound-wave bars -->
  <g fill="#4F5BE8">
    <rect x="329" y="438" width="46" height="90"  rx="23"/>
    <rect x="409" y="378" width="46" height="210" rx="23"/>
    <rect x="489" y="318" width="46" height="330" rx="23" fill="#3B44C4"/>
    <rect x="569" y="398" width="46" height="170" rx="23"/>
    <rect x="649" y="448" width="46" height="70"  rx="23"/>
  </g>
</svg>
